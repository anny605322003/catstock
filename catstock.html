<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="回測計算機">
<title>回測百分比計算機</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='40' fill='%231b1f26'/%3E%3Cpolygon points='58,72 32,18 92,58' fill='%239aa0a8'/%3E%3Cpolygon points='142,72 168,18 108,58' fill='%239aa0a8'/%3E%3Cpolygon points='62,64 50,32 82,57' fill='%23f6bdce'/%3E%3Cpolygon points='138,64 150,32 118,57' fill='%23f6bdce'/%3E%3Cellipse cx='100' cy='118' rx='64' ry='58' fill='%23d9dde2'/%3E%3Cpath d='M82,66 Q100,80 118,66' stroke='%235c6168' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Cpath d='M74,78 Q100,96 126,78' stroke='%235c6168' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Cpath d='M36,108 q14,3 24,12' stroke='%235c6168' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M34,128 q16,2 26,9' stroke='%235c6168' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M164,108 q-14,3 -24,12' stroke='%235c6168' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M166,128 q-16,2 -26,9' stroke='%235c6168' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cellipse cx='60' cy='140' rx='11' ry='6.5' fill='%23f6bdce' opacity='0.6'/%3E%3Cellipse cx='140' cy='140' rx='11' ry='6.5' fill='%23f6bdce' opacity='0.6'/%3E%3Cellipse cx='77' cy='115' rx='14' ry='16' fill='%23fff'/%3E%3Cellipse cx='123' cy='115' rx='14' ry='16' fill='%23fff'/%3E%3Cellipse cx='77' cy='118' rx='9' ry='11' fill='%23c98a3a'/%3E%3Cellipse cx='123' cy='118' rx='9' ry='11' fill='%23c98a3a'/%3E%3Ccircle cx='77' cy='120' r='4.5' fill='%231b1f26'/%3E%3Ccircle cx='123' cy='120' r='4.5' fill='%231b1f26'/%3E%3Ccircle cx='73' cy='113' r='2.5' fill='%23fff'/%3E%3Ccircle cx='119' cy='113' r='2.5' fill='%23fff'/%3E%3Cpath d='M100,134 l-7,8 h14 z' fill='%23e2553a'/%3E%3Cpath d='M100,142 q-11,11 -22,2' stroke='%234a4d52' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M100,142 q11,11 22,2' stroke='%234a4d52' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cline x1='14' y1='122' x2='46' y2='118' stroke='%23ffffff' stroke-width='2.5' opacity='0.8'/%3E%3Cline x1='14' y1='133' x2='46' y2='132' stroke='%23ffffff' stroke-width='2.5' opacity='0.8'/%3E%3Cline x1='186' y1='122' x2='154' y2='118' stroke='%23ffffff' stroke-width='2.5' opacity='0.8'/%3E%3Cline x1='186' y1='133' x2='154' y2='132' stroke='%23ffffff' stroke-width='2.5' opacity='0.8'/%3E%3C/svg%3E">
<style>
  :root{
    --bg: #14171c;
    --panel: #1b1f26;
    --display: #0f1115;
    --line: #2a2f38;
    --text: #eef0f3;
    --muted: #8a909c;
    --accent-down: #e2553a;   /* 減 / 虧損 */
    --accent-up: #2fa66a;     /* 加 / 獲利 */
    --key: #242933;
    --key-hover: #2c323e;
    --equals: #3d6bff;
    --equals-hover: #2f57e0;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    display:flex;
    justify-content:center;
    align-items: center;
    min-height: 100vh;
    padding: calc(24px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
  }
  .app{
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .cat-icon{ width: 34px; height: 34px; flex-shrink: 0; }
  .title{
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .display{
    background: var(--display);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .expr{
    min-height: 18px;
    font-size: 14px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    overflow-x: auto;
  }
  .value{
    font-size: 40px;
    text-align: right;
    font-weight: 600;
    margin-top: 4px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .value.up{ color: var(--accent-up); }
  .value.down{ color: var(--accent-down); }

  .pct-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .pct-btn{
    background: var(--key);
    border: 1px solid transparent;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 0;
    font-size: 13px;
    cursor: pointer;
  }
  .pct-btn:hover{ background: var(--key-hover); }
  .pct-btn.active{
    background: transparent;
    border-color: var(--accent-down);
    color: var(--accent-down);
    font-weight: 700;
  }
  .pct-btn.active.is-up{
    border-color: var(--accent-up);
    color: var(--accent-up);
  }

  .sign-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 14px;
  }
  .sign-btn{
    border: none;
    border-radius: 10px;
    padding: 10px 0;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: var(--key);
    color: var(--muted);
  }
  .sign-btn.active.minus{ background: var(--accent-down); color: #fff; }
  .sign-btn.active.plus{ background: var(--accent-up); color: #fff; }

  .pad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .key{
    background: var(--key);
    border: none;
    color: var(--text);
    border-radius: 12px;
    font-size: 19px;
    padding: 16px 0;
    cursor: pointer;
  }
  .key:hover{ background: var(--key-hover); }
  .key.func{ color: var(--muted); font-size: 16px; }
  .key.equals{
    background: var(--equals);
    color: #fff;
    grid-row: span 2;
  }
  .key.equals:hover{ background: var(--equals-hover); }
  .key:active, .pct-btn:active, .sign-btn:active{ transform: scale(0.96); }

  .hint{
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    text-align:center;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <svg class="cat-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <polygon points="58,72 32,18 92,58" fill="#9aa0a8"/>
      <polygon points="142,72 168,18 108,58" fill="#9aa0a8"/>
      <polygon points="62,64 50,32 82,57" fill="#f6bdce"/>
      <polygon points="138,64 150,32 118,57" fill="#f6bdce"/>
      <ellipse cx="100" cy="118" rx="64" ry="58" fill="#d9dde2"/>
      <path d="M82,66 Q100,80 118,66" stroke="#5c6168" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M74,78 Q100,96 126,78" stroke="#5c6168" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M36,108 q14,3 24,12" stroke="#5c6168" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M34,128 q16,2 26,9" stroke="#5c6168" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M164,108 q-14,3 -24,12" stroke="#5c6168" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M166,128 q-16,2 -26,9" stroke="#5c6168" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="60" cy="140" rx="11" ry="6.5" fill="#f6bdce" opacity="0.6"/>
      <ellipse cx="140" cy="140" rx="11" ry="6.5" fill="#f6bdce" opacity="0.6"/>
      <ellipse cx="77" cy="115" rx="14" ry="16" fill="#fff"/>
      <ellipse cx="123" cy="115" rx="14" ry="16" fill="#fff"/>
      <ellipse cx="77" cy="118" rx="9" ry="11" fill="#c98a3a"/>
      <ellipse cx="123" cy="118" rx="9" ry="11" fill="#c98a3a"/>
      <circle cx="77" cy="120" r="4.5" fill="#1b1f26"/>
      <circle cx="123" cy="120" r="4.5" fill="#1b1f26"/>
      <circle cx="73" cy="113" r="2.5" fill="#fff"/>
      <circle cx="119" cy="113" r="2.5" fill="#fff"/>
      <path d="M100,134 l-7,8 h14 z" fill="#e2553a"/>
      <path d="M100,142 q-11,11 -22,2" stroke="#4a4d52" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M100,142 q11,11 22,2" stroke="#4a4d52" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <line x1="14" y1="122" x2="46" y2="118" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <line x1="14" y1="133" x2="46" y2="132" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <line x1="186" y1="122" x2="154" y2="118" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <line x1="186" y1="133" x2="154" y2="132" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
    </svg>
    <div class="title">回測百分比計算機</div>
  </div>

  <div class="display">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="value" id="value">0</div>
  </div>

  <div class="pct-row" id="pctRow"></div>

  <div class="sign-row">
    <button class="sign-btn minus" id="signMinus">－ 減</button>
    <button class="sign-btn plus" id="signPlus">＋ 加</button>
  </div>

  <div class="pad">
    <button class="key" data-d="7">7</button>
    <button class="key" data-d="8">8</button>
    <button class="key" data-d="9">9</button>
    <button class="key func" id="clear">C</button>

    <button class="key" data-d="4">4</button>
    <button class="key" data-d="5">5</button>
    <button class="key" data-d="6">6</button>
    <button class="key func" id="back">⌫</button>

    <button class="key" data-d="1">1</button>
    <button class="key" data-d="2">2</button>
    <button class="key" data-d="3">3</button>
    <button class="key equals" id="equals" rowspan="2">＝</button>

    <button class="key" data-d="0">0</button>
    <button class="key" data-d=".">.</button>
    <button class="key func" id="useResult">用此結果</button>
  </div>

  <div class="hint">輸入數值 → 選百分比與加減 → 按＝</div>
</div>

<script>
  const percents = [5, 8, 10, 12, 15, 18, 20];
  let selectedPercent = 5;
  let sign = -1; // -1 = 減, 1 = 加
  let input = "";
  let lastResult = null;

  const exprEl = document.getElementById("expr");
  const valueEl = document.getElementById("value");
  const pctRow = document.getElementById("pctRow");

  function renderPctButtons(){
    pctRow.innerHTML = "";
    percents.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "pct-btn";
      btn.textContent = p + "%";
      if (p === selectedPercent) {
        btn.classList.add("active");
        if (sign === 1) btn.classList.add("is-up");
      }
      btn.addEventListener("click", () => {
        selectedPercent = p;
        renderPctButtons();
        updateExpr();
      });
      pctRow.appendChild(btn);
    });
  }

  function renderSignButtons(){
    document.getElementById("signMinus").classList.toggle("active", sign === -1);
    document.getElementById("signPlus").classList.toggle("active", sign === 1);
  }

  function updateExpr(){
    const base = input === "" ? "0" : input;
    const op = sign === -1 ? "－" : "＋";
    exprEl.textContent = `${base}  ×  (1 ${op} ${selectedPercent}%)`;
  }

  function updateValueDisplay(text, cls){
    valueEl.textContent = text;
    valueEl.classList.remove("up", "down");
    if (cls) valueEl.classList.add(cls);
  }

  function refresh(){
    renderPctButtons();
    renderSignButtons();
    updateExpr();
    updateValueDisplay(input === "" ? "0" : input, null);
  }

  // 數字鍵
  document.querySelectorAll(".key[data-d]").forEach(btn => {
    btn.addEventListener("click", () => {
      const d = btn.getAttribute("data-d");
      if (d === "." && input.includes(".")) return;
      if (input.length >= 15) return;
      input += d;
      updateValueDisplay(input, null);
      updateExpr();
    });
  });

  document.getElementById("clear").addEventListener("click", () => {
    input = "";
    lastResult = null;
    updateValueDisplay("0", null);
    updateExpr();
  });

  document.getElementById("back").addEventListener("click", () => {
    input = input.slice(0, -1);
    updateValueDisplay(input === "" ? "0" : input, null);
    updateExpr();
  });

  document.getElementById("signMinus").addEventListener("click", () => {
    sign = -1;
    refresh();
  });
  document.getElementById("signPlus").addEventListener("click", () => {
    sign = 1;
    refresh();
  });

  document.getElementById("equals").addEventListener("click", () => {
    const base = parseFloat(input === "" ? "0" : input);
    const result = base * (1 + sign * selectedPercent / 100);
    lastResult = result;
    const rounded = Math.round(result * 10000) / 10000;
    updateValueDisplay(String(rounded), sign === -1 ? "down" : "up");
  });

  document.getElementById("useResult").addEventListener("click", () => {
    if (lastResult === null) return;
    input = String(Math.round(lastResult * 10000) / 10000);
    updateValueDisplay(input, null);
    updateExpr();
  });

  refresh();
</script>
</body>
</html>
